version: "3.8"

networks:
  mynetwork:
    driver: bridge

services:
  app:
    build: .
    container_name: blog_app
    expose:
      - "3000"
    environment:
      NODE_ENV: production
    volumes:
      - ./db.sqlite:/usr/src/app/db.sqlite
      - ./public:/usr/src/app/public
      - ./access.log:/usr/src/app/access.log
      - ./essential-access.log:/usr/src/app/essential-access.log
    networks:
      - mynetwork
    restart: unless-stopped

  caddy:
    image: caddy:2.7.6
    container_name: blog_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mynetwork
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: